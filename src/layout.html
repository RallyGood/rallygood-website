<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="theme-color" content="#6f3cff">
  <link rel="canonical" href="{{SITE_URL}}/{{PATH}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:site_name" content="RallyGood">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/{{PATH}}">
  <meta property="og:image" content="{{SITE_URL}}/assets/social-card.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="{{BODYCLASS}}">
  <a class="skip-link" href="#main">Skip to content</a>
{{HEADER}}
  <main id="main">
{{CONTENT}}
  </main>
{{FOOTER}}
  <script src="/script.js" defer></script>
</body>
</html>
